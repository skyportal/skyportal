[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "skyportal-py"
version = "0.1.0"
description = "First-party Python client for the SkyPortal API"
readme = "README.md"
authors = [{ name = "Leo Conforti", email = "leo@leoconforti.us" }]
license = "BSD-3-clause"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Topic :: Scientific/Engineering :: Astronomy",
]
# Published packages release in lockstep at one version, so the sibling pin is
# exact; `uv lock` then fails if a bump misses one of them.
dependencies = ["httpx>=0.27", "pydantic>=2", "skyportal-py-models==0.1.0"]
requires-python = ">=3.11"

[project.urls]
source = "https://github.com/skyportal/skyportal"

[dependency-groups]
dev = ["ruff", "ty"]
test = ["pytest", "respx"]

# Stripped at build time; the published wheel carries the `==` requirement above.
[tool.uv.sources]
skyportal-py-models = { workspace = true }

[tool.setuptools.packages.find]
include = ["skyportal_py*"]
