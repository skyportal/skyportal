name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    if: github.head_ref == 'release' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag and create the GitHub release
      id-token: write # OIDC token for PyPI trusted publishing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      # uv builds a workspace member, so every member has to be present.
      - name: Check out the baselayer submodule
        run: git submodule update --init --depth 1 baselayer

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Build both distributions
        run: |
          uv build --package skyportal-py-models --out-dir dist
          uv build --package skyportal-py --out-dir dist

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

      - uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        with:
          version: 0.23.0

      - name: Tag and create the GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: knope release
