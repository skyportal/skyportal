name: Client changeset

# `projects/` holds the published Python clients, whose versions and changelog
# come from Knope changesets (see doc/contributing.md). A PR that touches them
# has to say how it bumps them, or carry the `skip-changelog` label.

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
    branches: [main]

permissions:
  contents: read

jobs:
  changeset:
    if: ${{ github.head_ref != 'release/clients' && !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for a changeset
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "origin/$BASE...HEAD")

          # CHANGELOG.md is written by the release workflow, so a PR that only
          # touches it has not changed the clients.
          clients=$(grep '^projects/' <<< "$changed" \
            | grep -v '^projects/CHANGELOG\.md$' || true)

          if [ -z "$clients" ]; then
            echo "No client changes; no changeset needed."
            exit 0
          fi

          if grep -q '^\.changeset/.*\.md$' <<< "$changed"; then
            echo "Changeset found."
          else
            echo "::error::This PR changes the Python clients, so it needs a changeset under .changeset/ (run 'knope document-change', see doc/contributing.md) or the 'skip-changelog' label."
            exit 1
          fi
