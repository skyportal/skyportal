name: Prepare release

on:
  push:
    branches: [main]
    paths: [".changeset/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Look for changesets
        id: changes
        run: |
          if find .changeset -name '*.md' | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No changesets in .changeset, nothing to prepare."
          fi

      # uv lock needs every workspace member
      - name: Check out the baselayer submodule
        if: steps.changes.outputs.found == 'true'
        run: git submodule update --init --depth 1 baselayer

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        if: steps.changes.outputs.found == 'true'

      - uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        if: steps.changes.outputs.found == 'true'
        with:
          version: 0.23.0

      # Three unpadded segments: Knope's override parses no more, PEP 440 strips zeros
      - name: Work out the version
        if: steps.changes.outputs.found == 'true'
        id: calver
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime
          import pathlib
          import re

          text = pathlib.Path("pyproject.toml").read_text()
          current = re.search(r"""^version = ['"]([^'"]+)['"]""", text, re.M).group(1)

          today = datetime.date.today()
          prefix = f"{today.year}.{today.month}"
          micro = (
              int(current.rsplit(".", 1)[1]) + 1
              if current.startswith(f"{prefix}.")
              else 0
          )
          print(f"version={prefix}.{micro}")
          PY

      - name: Open or update the release pull request
        if: steps.changes.outputs.found == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.calver.outputs.version }}
        run: knope prepare-release --verbose --override-version "$VERSION"
