version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
      time: "06:00"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      # Listed first: a package joins the first group it matches, so this has to
      # precede the catch-all below. Keeps the rjsf packages in lockstep --
      # bumping @rjsf/core alone leaves "incorrect peer dependency" against the
      # siblings still on the old pin.
      rjsf:
        patterns:
          - "@rjsf/*"
      # One PR per month for the safe bumps, instead of ten that each need the
      # lockfile regenerated by hand. Majors are left ungrouped so they still
      # get individual scrutiny.
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # eslint-plugin-react has no ESLint 10 support at any published version
      # (7.37.5 peers on `^9.7`), so eslint 10 breaks linting outright. Drop
      # these two once the plugin ships it.
      - dependency-name: eslint
        versions:
          - ">=10"
      - dependency-name: "@eslint/js"
        versions:
          - ">=10"
      # `typescript` here feeds typescript-eslint, which cannot read the TS 7
      # API (see typescript-eslint#10940). Typechecking already runs TS 7 via
      # the separate `typescript7` alias, so this pin costs nothing.
      - dependency-name: typescript
        versions:
          - ">=7"
      - dependency-name: "@date-io/dayjs"
        versions:
          - ">= 0"
      - dependency-name: react-dnd
        versions:
          - ">= 0"
      - dependency-name: mui-datatables
        versions:
          - 3.7.6
      - dependency-name: redoc
        versions:
          - 2.0.0-rc.41
          - 2.0.0-rc.48
      - dependency-name: react
        versions:
          - 16.14.0
          - 17.0.1
      - dependency-name: "@rjsf/core"
        versions:
          - 2.4.1
      - dependency-name: react-hook-form
        versions:
          - 6.14.2
      - dependency-name: "@babel/plugin-transform-async-to-generator"
        versions:
          - 7.12.1
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
      time: "06:00"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: dask
        versions:
          - 2021.1.1
      - dependency-name: numpy
        versions:
          - 1.20.0
      - dependency-name: pandas
        versions:
          - 1.2.1
